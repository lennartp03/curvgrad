[project]
name = "curvgrad"
version = "0.1.0"
description = "From-scratch autograd + curvature-based Laplace approximation, unifying neural network weight posteriors and GLMM random effects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lennart Pahl" },
]
keywords = ["autograd", "laplace-approximation", "glmm", "bayesian-deep-learning", "curvature"]

dependencies = [
    "numpy>=1.26",
]

# Development tooling only. None of this is imported by curvgrad itself.
# `uv sync` installs the `dev` group by default.
[dependency-groups]
test = [
    "pytest>=8.0",
    "torch>=2.2",       # gradient check oracle
]
examples = [
    "matplotlib>=3.8",
    "tueplots>=0.2",
    "ipykernel>=7.4",   # notebook kernel
]
dev = [
    { include-group = "test" },
    { include-group = "examples" },
    "ruff>=0.5",        # lint and format
    "mypy>=1.10",       # type checking
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curvgrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
