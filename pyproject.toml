[project]
name = "curvgrad"
version = "0.1.0"
description = "From-scratch autograd + curvature-based Laplace approximation, unifying neural network weight posteriors and GLMM random effects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lennart Pahl" },
]
keywords = ["autograd", "laplace-approximation", "glmm", "bayesian-deep-learning", "curvature"]

dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Used only in tests/benchmarks — never imported by curvgrad itself.
test = [
    "pytest>=8.0",
    "torch>=2.2",          # gradient-check oracle 
    "statsmodels>=0.14",   # GLMM reference estimates 
]
dev = [
    "curvgrad[test]",
    "ruff>=0.5",            # lint + format
    "mypy>=1.10",           # type checking
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curvgrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true